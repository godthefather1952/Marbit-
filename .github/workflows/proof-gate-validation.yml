name: proof-gate-validation

on:
  push:
    branches:
      - proof-gated-strategy
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install core dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile changed runtime modules
        run: |
          python -m py_compile \
            kalshi.py \
            kalshi_execution.py \
            strategies.py \
            proof_gate.py \
            kalshi_monitor.py \
            kalshi_score.py \
            test_signal_path.py
      - name: Run project validation harness
        run: python test_signal_path.py
